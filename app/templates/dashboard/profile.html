{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto mt-8">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden transition-colors duration-300 border border-gray-100 dark:border-slate-700">
        
        <!-- Header màu xanh -->
        <div class="bg-gradient-to-r from-blue-500 to-blue-700 h-32"></div>
        
        <!-- Nội dung Profile -->
        <div class="px-8 pb-8">
            
            <!-- Sử dụng Flexbox, CHỈ kéo Avatar lên, Tên/Email để dưới nền trắng -->
            <div class="flex flex-col sm:flex-row items-center sm:items-end gap-4 sm:gap-6 mb-6 relative z-10 mt-4 sm:mt-0">
                
                <!-- Avatar (Chỉ thẻ div này có -mt-12 để kéo lên) -->
                <div class="-mt-16 sm:-mt-12 w-24 h-24 bg-white dark:bg-slate-800 rounded-full flex items-center justify-center shadow-lg border-4 border-white dark:border-slate-800 text-3xl font-bold text-blue-600 uppercase flex-shrink-0">
                    {{ current_user.username[0] }}
                </div>
                
                <!-- Tên và Email (Nằm yên dưới nền trắng) -->
                <div class="text-center sm:text-left mb-2 w-full">
                    <h2 class="text-2xl font-bold text-gray-800 dark:text-slate-100">{{ current_user.username }}</h2>
                    <p class="text-gray-500 dark:text-slate-400">{{ current_user.email }}</p>
                </div>
            </div>
            
            <!-- Thông tin chi tiết -->
            <div class="border-t border-gray-200 dark:border-slate-700 pt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Thành viên từ</label>
                    <p class="text-lg text-gray-800 dark:text-slate-200 mt-1">{{ current_user.created_at.strftime('%d/%m/%Y') }}</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Trạng thái</label>
                    <span class="inline-block bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300 px-3 py-1 rounded-full text-sm font-semibold mt-1">
                        Hoạt động
                    </span>
                </div>
            </div>
            
            <!-- Nút Đổi mật khẩu -->
            <div class="mt-8">
                <a href="{{ url_for('auth.change_password') }}" class="inline-block bg-gray-800 dark:bg-slate-600 text-white py-2 px-6 rounded shadow hover:bg-gray-900 dark:hover:bg-slate-500 transition duration-200 font-semibold">
                    Đổi mật khẩu
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
