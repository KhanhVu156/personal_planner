services:
  - type: web
    name: personal-planner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m flask db upgrade && gunicorn -c gunicorn.conf.py run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production