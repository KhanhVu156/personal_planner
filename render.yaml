services:
  - type: web
    name: personal-planner
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # TƯ DUY: Dùng lệnh flask db upgrade chuẩn thay vì python -m flask để gọn hơn.
    # Nếu lệnh upgrade thất bại, Gunicorn sẽ không được chạy (đảm bảo an toàn DB).
    startCommand: flask db upgrade && gunicorn -c gunicorn.conf.py run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FLASK_ENV
        value: production